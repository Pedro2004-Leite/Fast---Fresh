<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Mapa e avisos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes ss-pulse{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.2);opacity:0}}
@keyframes ss-ring{0%,100%{box-shadow:0 0 0 0 rgba(216,50,43,.55)}50%{box-shadow:0 0 0 6px rgba(216,50,43,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
button:focus-visible{outline:3px solid #27282A;outline-offset:2px;box-shadow:0 0 0 6px #F5F6F6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #D9DBDC; color: #27282A; font-family: 'Hanken Grotesk', system-ui, sans-serif">

  <header style="flex: none; height: 56px; padding: 0 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
    <span role="img" aria-label="Pedro" style="flex: none; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid #27282A">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path style="fill: #27282A" d="M4 21c0-4.6 3.4-7.4 8-7.4s8 2.8 8 7.4z"></path><circle style="fill: #27282A; stroke: #FFFFFF; stroke-width: 1.6" cx="12" cy="8" r="4.4"></circle></svg>
    </span>
    <div style="min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 17px; font-weight: 800; line-height: 1.1">Pedro</span>
        <span style="padding: 2px 6px; border-radius: 6px; background: #E5E7E8; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; line-height: 1.2">ID 20417</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; line-height: 1.2; color: #3A3C3E">Continente Bom Dia São Romão · Leiria</span>
    </div>
  </header>

  <section aria-label="Planta da zona de frutas e legumes, vista de cima" style="position: relative; flex: none; width: 390px; height: 480px; margin: 0; background: #FFFFFF; border-radius: 0 0 24px 24px; overflow: hidden">

    <div role="img" aria-label="Bancada de frutas e legumes: 5 módulos, 56 produtos" style="position: absolute; left: 119px; top: 40px; width: 152px; height: 400px">
      <sc-for list="{{ cells }}" as="c" hint-placeholder-count="56">
        <div style="position: absolute; box-sizing: border-box; border-radius: 2px; {{ c.style }}"></div>
      </sc-for>
      <sc-for list="{{ spines }}" as="p" hint-placeholder-count="5">
        <div style="position: absolute; box-sizing: border-box; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; {{ p.style }}">{{ p.n }}</div>
      </sc-for>
    </div>

    <sc-for list="{{ marks }}" as="k" hint-placeholder-count="6">
      <button type="button" onClick="{{ k.select }}" aria-label="{{ k.aria }}" aria-pressed="{{ k.selected }}" style="position: absolute; z-index: 3; width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; {{ k.pos }}"></button>
    </sc-for>

    <div role="img" aria-label="A tua posição, corredor A" style="position: absolute; left: 60px; top: 240px; width: 0; height: 0; z-index: 6">
      <span style="position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; background: #27282A; animation: ss-pulse 2s ease-out infinite"></span>
      <span style="position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; background: #27282A; border: 2px solid #FFFFFF; box-shadow: 0 0 0 2px #27282A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #FFFFFF">Tu</span>
    </div>
  </section>

  <section aria-label="Lista de avisos" style="flex: 1; min-height: 0; margin-top: 12px; padding: 10px 16px 0; display: flex; flex-direction: column; background: #F5F6F6; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(39, 40, 42, .16)">
    <div style="flex: none; align-self: center; width: 40px; height: 4px; margin-bottom: 10px; border-radius: 2px; background: #27282A; opacity: .25"></div>

    <div style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.active }}" style="margin: 0; height: 56px; padding: 6px 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; border: 0; border-radius: 14px; font: inherit; text-align: left; cursor: pointer; {{ c.style }}">
          <span style="display: flex; align-items: center; gap: 6px">
            <span style="width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{ c.dotStyle }}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="fill: none; stroke: {{ c.color }}; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{ c.icon }}"></path></svg>
            </span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; line-height: 1">{{ c.count }}</span>
          </span>
          <span style="font-size: 12px; font-weight: 700">{{ c.label }}</span>
        </button>
      </sc-for>
    </div>

    <div style="flex: none; padding: 10px 4px 4px; font-size: 12px; font-weight: 600; color: #585B5E">{{ listLabel }} · por gravidade e distância</div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px">
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 28px 8px; text-align: center; font-size: 15px; font-weight: 600; color: #585B5E">Sem avisos neste nível.</div>
      </sc-if>
      <sc-for list="{{ warnings }}" as="w" hint-placeholder-count="4">
        <div>
          <div style="height: 1px; margin: 0 8px; background: rgba(39, 40, 42, .14)"></div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 10px 8px; border-radius: 12px; {{ w.rowExtra }}">
            <button type="button" onClick="{{ w.select }}" style="flex: 1; min-width: 0; min-height: 56px; margin: 0; padding: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer">
              <span style="flex: none; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; {{ w.badgeStyle }}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="fill: none; stroke: {{ w.iconColor }}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="{{ w.icon }}"></path></svg>
              </span>
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 800; line-height: 1.2">{{ w.name }}</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: #585B5E">{{ w.where }}</span>
                <span style="font-size: 13px; font-weight: 600; line-height: 1.25">{{ w.msg }}</span>
                <sc-if value="{{ w.hasComplaint }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 12px; font-style: italic; line-height: 1.25">{{ w.complaintText }}</span>
                </sc-if>
                <span style="font-size: 12px; font-weight: 600; color: #585B5E">{{ w.meta }}</span>
              </span>
            </button>
            <button type="button" onClick="{{ w.claim }}" aria-pressed="{{ w.claimed }}" style="flex: none; min-width: 84px; height: 44px; margin: 0; padding: 0 14px; border-radius: 22px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; {{ w.claimStyle }}">{{ w.claimLabel }}</button>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const selected = st.selected !== undefined ? st.selected : null;
    const filter = st.filter !== undefined ? st.filter : 'all';
    const claimed = st.claimed || {};

    // <partilhado> (o mesmo bloco nos 3 ecrãs: cores, geometria, planograma, eventos e caminho)
    const INK = '#27282A';
    const BASE = '#D3D5D6';
    // Gravidade: cor do retângulo no mapa e dos distintivos (vermelho mais escuro, amarelo mais claro).
    const SEV_BG = { 3: '#D8322B', 2: '#F28C1F', 1: '#FFD21F' };
    const SEV_INK = { 3: '#FFFFFF', 2: INK, 1: INK };

    // Geometria (px). Ilha de 152 x 400 centrada no mapa de 390 x 480, com 40 px de passagem no topo e no fundo.
    // Todas as medidas são inteiras: intervalo de 2 px entre retângulos e 4 px entre módulos; sem linhas nem rebordos.
    // 5 módulos: 1 e 5 = pontas (uma só face, 130 x 60); 2, 3 e 4 = duas faces (A à esquerda, B à direita, 64 x 88)
    // com o nº do módulo numa faixa de 20 px ao meio.
    const IX = 119, IY = 40;
    const GAP = 2, MGAP = 4;
    const CAP_H = 60, MOD_H = 88;
    const SPINE_W = 20, BLOCK_W = 64, CAP_W = 130;
    const me = { x: 60, y: 240 };
    const AISLE_B_X = 330;
    const CROSS_TOP = 20, CROSS_BOTTOM = 460;
    const METERS_PER_PX = 0.03;

    const ICON = {
      3: 'M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z M12 8v5 M12 16.5h.01',
      2: 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01',
      1: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M12 8v4 M12 16h.01',
      all: 'M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01'
    };
    const LV = {
      3: { word: 'CRÍTICO', label: 'Crítico' },
      2: { word: 'ALTO', label: 'Alto' },
      1: { word: 'MÉDIO', label: 'Médio' }
    };

    // Cada retângulo pequeno = uma classe de produto (as 56 de classes.json), uma só vez em toda a planta.
    // Cada face junta 1 ou 2 câmaras do planograma; area_id = câmara_nº (nº = posição dentro da câmara).
    // cols x rows = nº de retângulos da face. Corredor A = fruta, corredor B = legumes, pontas = fruta.
    const CLS = {
      'apples': 'Maçã', 'apricots': 'Alperce', 'avocados': 'Abacate', 'bananas': 'Banana', 'broccoli': 'Brócolos',
      'cabbages': 'Couve branca', 'cauliflower': 'Couve-flor', 'chayotes': 'Chuchu', 'collard greens': 'Couve portuguesa',
      'cucumbers': 'Pepino', 'eggplants': 'Beringela', 'garlic': 'Alho', 'ginger': 'Gengibre', 'green beans': 'Feijão verde',
      'green grapes': 'Uva branca', 'green peppers': 'Pimento verde', 'guavas': 'Goiaba', 'kiwis': 'Kiwi', 'lemons': 'Limão',
      'limes': 'Lima', 'mangoes': 'Manga', 'melons': 'Melão', 'nectarines': 'Nectarina', 'onions': 'Cebola', 'oranges': 'Laranja',
      'packaged apples': 'Maçã (embalada)', 'packaged cherries': 'Cereja (embalada)',
      'packaged cherry tomatoes': 'Tomate cherry (embalada)', 'packaged dragon fruits': 'Pitaya (embalada)',
      'packaged garlic': 'Alho (embalada)', 'packaged green grapes': 'Uva branca (embalada)', 'packaged kiwis': 'Kiwi (embalada)',
      'packaged lettuce': 'Alface (embalada)', 'packaged onions': 'Cebola (embalada)', 'packaged oranges': 'Laranja (embalada)',
      'packaged passion fruits': 'Maracujá (embalada)', 'packaged potatoes': 'Batata (embalada)',
      'packaged red onions': 'Cebola roxa (embalada)', 'packaged shallots': 'Chalota (embalada)',
      'packaged strawberries': 'Morango (embalada)', 'packaged tomatoes': 'Tomate (embalada)', 'papayas': 'Papaia',
      'passion fruits': 'Maracujá', 'peaches': 'Pêssego', 'pears': 'Pera', 'pineapples': 'Ananás', 'potatoes': 'Batata',
      'pumpkins': 'Abóbora', 'red cabbages': 'Couve roxa', 'red grapes': 'Uva vermelha', 'red onions': 'Cebola roxa',
      'red peppers': 'Pimento vermelho', 'sweet potatoes': 'Batata-doce', 'tomatoes': 'Tomate', 'watermelons': 'Melancia',
      'zucchini': 'Curgete'
    };
    const FACES = [
      { m: 1, s: 'E', label: 'Citrinos', cols: 2, rows: 2, parts: [
        { cam: '6215', items: ['oranges', 'packaged oranges', 'lemons', 'limes'] }] },
      { m: 2, s: 'A', label: 'Maçãs, peras e embalados', cols: 2, rows: 3, parts: [
        { cam: '6373', items: ['apples', 'packaged apples', 'pears'] },
        { cam: '6385', items: ['packaged cherries', 'packaged dragon fruits', 'packaged passion fruits'] }] },
      { m: 2, s: 'B', label: 'Folhas e couves', cols: 2, rows: 5, parts: [
        { cam: '6383', items: ['packaged lettuce', 'collard greens', 'green beans', 'cucumbers', 'eggplants'] },
        { cam: '6386', items: ['broccoli', 'cabbages', 'red cabbages', 'cauliflower', 'zucchini'] }] },
      { m: 3, s: 'A', label: 'Kiwis e fruta de caroço', cols: 2, rows: 3, parts: [
        { cam: '6376', items: ['kiwis', 'packaged kiwis', 'avocados'] },
        { cam: '6491', items: ['apricots', 'peaches', 'nectarines'] }] },
      { m: 3, s: 'B', label: 'Tomates, pimentos e cebolas', cols: 3, rows: 3, parts: [
        { cam: '6443', items: ['tomatoes', 'packaged tomatoes', 'packaged cherry tomatoes', 'green peppers', 'red peppers'] },
        { cam: '6594', items: ['onions', 'red onions', 'garlic', 'packaged garlic'] }] },
      { m: 4, s: 'A', label: 'Melões e uvas', cols: 2, rows: 3, parts: [
        { cam: '6371', items: ['melons', 'watermelons', 'packaged strawberries'] },
        { cam: '6462', items: ['green grapes', 'red grapes', 'packaged green grapes'] }] },
      { m: 4, s: 'B', label: 'Batatas e raízes', cols: 3, rows: 3, parts: [
        { cam: '6591', items: ['potatoes', 'sweet potatoes', 'packaged potatoes', 'ginger', 'pumpkins'] },
        { cam: '6781', items: ['packaged onions', 'packaged red onions', 'packaged shallots', 'chayotes'] }] },
      { m: 5, s: 'E', label: 'Fruta tropical', cols: 3, rows: 2, parts: [
        { cam: '6468', items: ['pineapples', 'papayas', 'mangoes', 'guavas', 'bananas', 'passion fruits'] }] }
    ];
    const cellsOf = (f) => {
      const out = [];
      f.parts.forEach((p) => p.items.forEach((k, i) => out.push({ id: p.cam + '_' + (i + 1), cls: k })));
      return out;
    };
    const faceN = (f) => f.cols * f.rows;
    const isCap = (m) => m === 1 || m === 5;
    const modTop = (m) => (m === 1 ? 0 : CAP_H + MGAP + (m - 2) * (MOD_H + MGAP));
    const faceRect = (f) => {
      const y = modTop(f.m);
      if (f.s === 'E') return { x: SPINE_W + GAP, y: y, w: CAP_W, h: CAP_H };
      return { x: f.s === 'A' ? 0 : BLOCK_W + GAP + SPINE_W + GAP, y: y, w: BLOCK_W, h: MOD_H };
    };
    const gridOf = (f) => {
      const r = faceRect(f);
      return { cols: f.cols, rows: f.rows, cw: (r.w - (f.cols - 1) * GAP) / f.cols, ch: (r.h - (f.rows - 1) * GAP) / f.rows };
    };
    // Posição do retângulo i da face, relativa à ilha.
    const cellPos = (f, i) => {
      const r = faceRect(f);
      const g = gridOf(f);
      return { x: r.x + (i % g.cols) * (g.cw + GAP), y: r.y + Math.floor(i / g.cols) * (g.ch + GAP), w: g.cw, h: g.ch };
    };
    const whereOf = (f) => 'Módulo ' + f.m + (f.s === 'E' ? ' · Ponta' : ' · Corredor ' + f.s);

    // Últimos eventos (area_id, stock_level, complaint?) recebidos; o nome do produto vem da classe do retângulo.
    const EVENTS = [
      { id: '6468_5', stock: 0, complaint: null, ago: 1 },
      { id: '6443_3', stock: 6, complaint: 'Tomate cherry esgotado', ago: 2 },
      { id: '6373_1', stock: 8, complaint: null, ago: 4 },
      { id: '6591_3', stock: 52, complaint: 'Preço errado na etiqueta', ago: 6 },
      { id: '6215_1', stock: 22, complaint: null, ago: 9 },
      { id: '6594_3', stock: 19, complaint: null, ago: 12 }
    ];

    const sevOf = (a) => {
      if (a.stock === 0) return 3;
      if (a.complaint && a.stock < 10) return 3;
      if (a.complaint || a.stock < 10) return 2;
      if (a.stock < 25) return 1;
      return 0;
    };

    // Caminho a pé até ao retângulo (px do mapa): face A pelo corredor A; face B e pontas contornam a ilha
    // pela passagem do topo ou do fundo. A mesma conta serve os 3 ecrãs.
    const plen = (pts) => {
      let t = 0;
      for (let i = 1; i < pts.length; i++) t += Math.abs(pts[i].x - pts[i - 1].x) + Math.abs(pts[i].y - pts[i - 1].y);
      return t;
    };
    const routeOf = (face, cx, cy) => {
      if (face.s === 'A') return [me, { x: me.x, y: cy }, { x: cx, y: cy }];
      if (face.s === 'E') {
        const yp = face.m === 1 ? CROSS_TOP : CROSS_BOTTOM;
        return [me, { x: me.x, y: yp }, { x: cx, y: yp }, { x: cx, y: cy }];
      }
      const via = (yp) => [me, { x: me.x, y: yp }, { x: AISLE_B_X, y: yp }, { x: AISLE_B_X, y: cy }, { x: cx, y: cy }];
      return plen(via(CROSS_TOP)) <= plen(via(CROSS_BOTTOM)) ? via(CROSS_TOP) : via(CROSS_BOTTOM);
    };
    const distOf = (face, cx, cy) => Math.max(1, Math.round(plen(routeOf(face, cx, cy)) * METERS_PER_PX));
    // Onde está um evento: face, posição do retângulo, nome do produto e centro (px do mapa).
    const place = (e) => {
      let face = null;
      let i = -1;
      FACES.forEach((f) => {
        const j = cellsOf(f).map((c) => c.id).indexOf(e.id);
        if (j >= 0) { face = f; i = j; }
      });
      const p = cellPos(face, i);
      return { face: face, i: i, name: CLS[cellsOf(face)[i].cls], cx: IX + p.x + p.w / 2, cy: IY + p.y + p.h / 2 };
    };
    // </partilhado>

    const items = EVENTS.map((e) => {
      const pl = place(e);
      return { e: e, name: pl.name, face: pl.face, cx: pl.cx, cy: pl.cy, sev: sevOf(e), dist: distOf(pl.face, pl.cx, pl.cy) };
    });

    const selItem = items.filter((it) => it.e.id === selected)[0];
    const selFace = selItem ? selItem.face : null;

    const evById = {};
    items.forEach((it) => { evById[it.e.id] = it; });

    // Um retângulo por produto: cinzento, ou da cor da gravidade quando tem aviso.
    const cells = [];
    FACES.forEach((f) => {
      cellsOf(f).forEach((c, i) => {
        const p = cellPos(f, i);
        const it = evById[c.id];
        let style = 'left: ' + p.x + 'px; top: ' + p.y + 'px; width: ' + p.w + 'px; height: ' + p.h + 'px; background: ' + (it ? SEV_BG[it.sev] : BASE) + ';';
        if (it && it.sev === 3) style += ' animation: ss-ring 1.8s ease-out infinite;';
        if (it) style += (it.e.id === selected ? ' z-index: 2; outline: 2px solid ' + INK + '; outline-offset: 2px;' : ' z-index: 1;');
        cells.push({ style: style });
      });
    });

    const spines = [];
    for (let m = 1; m <= 5; m++) {
      const isSel = !!selFace && selFace.m === m;
      const cap = isCap(m);
      spines.push({
        n: String(m),
        style: 'left: ' + (cap ? 0 : BLOCK_W + GAP) + 'px; top: ' + modTop(m) + 'px; width: ' + SPINE_W + 'px; height: ' + (cap ? CAP_H : MOD_H) + 'px; ' +
          (isSel ? 'background: ' + INK + '; color: #FFFFFF;' : 'background: #B4B7B9; color: #2F3234;')
      });
    }

    // Botões transparentes de 44 px por cima de cada retângulo com aviso (a cor já está no retângulo).
    const marks = items.map((it) => {
      const isSel = it.e.id === selected;
      return {
        pos: 'left: ' + Math.round(it.cx - 22) + 'px; top: ' + Math.round(it.cy - 22) + 'px;',
        aria: it.name + ', ' + whereOf(it.face).toLowerCase() + ', ' + LV[it.sev].label.toLowerCase(),
        selected: isSel,
        select: () => this.setState({ selected: isSel ? null : it.e.id })
      };
    });

    const all = items.slice().sort((p, q) => (q.sev - p.sev) || (p.dist - q.dist));
    const counts = { 3: 0, 2: 0, 1: 0 };
    all.forEach((it) => { counts[it.sev] += 1; });
    const shown = filter === 'all' ? all : all.filter((it) => String(it.sev) === filter);

    const warnings = shown.map((it) => {
      const e = it.e;
      const lv = LV[it.sev];
      const isDone = !!claimed[e.id];
      const verb = e.stock < 25 ? 'Repor' : 'Verificar';
      return {
        name: it.name,
        icon: ICON[it.sev],
        badgeStyle: 'background: ' + SEV_BG[it.sev] + ';',
        iconColor: SEV_INK[it.sev],
        where: e.id + ' · ' + whereOf(it.face),
        msg: verb + ' · stock a ' + e.stock + '%',
        hasComplaint: !!e.complaint,
        complaintText: e.complaint ? 'Reclamação: “' + e.complaint + '”' : '',
        meta: lv.word + ' · a ' + it.dist + ' m · há ' + e.ago + ' min',
        rowExtra: e.id === selected ? 'background: rgba(39, 40, 42, .08);' : '',
        select: () => this.setState({ selected: e.id === selected ? null : e.id }),
        claimed: isDone,
        claimLabel: isDone ? 'A tratar' : 'Vou eu',
        claimStyle: isDone
          ? 'background: transparent; color: #27282A; border: 2px solid #27282A;'
          : 'background: #27282A; color: #F5F6F6; border: 2px solid #27282A;',
        claim: () => {
          const next = Object.assign({}, claimed);
          next[e.id] = !isDone;
          this.setState({ claimed: next });
        }
      };
    });

    const mkChip = (key, label, count, icon, dotBg, iconInk) => {
      const active = filter === key;
      return {
        label: label,
        count: String(count),
        icon: icon,
        color: iconInk,
        active: active,
        style: active ? 'background: #27282A; color: #F5F6F6;' : 'background: #E5E7E8; color: #27282A;',
        dotStyle: 'background: ' + dotBg + ';',
        pick: () => this.setState({ filter: key })
      };
    };
    const chips = [
      mkChip('all', 'Todos', all.length, ICON.all, '#6E7173', '#F5F6F6'),
      mkChip('3', 'Crítico', counts[3], ICON[3], SEV_BG[3], SEV_INK[3]),
      mkChip('2', 'Alto', counts[2], ICON[2], SEV_BG[2], SEV_INK[2]),
      mkChip('1', 'Médio', counts[1], ICON[1], SEV_BG[1], SEV_INK[1])
    ];

    return {
      cells: cells,
      spines: spines,
      marks: marks,
      warnings: warnings,
      chips: chips,
      empty: warnings.length === 0,
      listLabel: warnings.length + (warnings.length === 1 ? ' aviso' : ' avisos')
    };
  }
}
</script>
</body>
</html>
